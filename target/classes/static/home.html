<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>CodeMirror WebSocket Collaboration Test</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/mode/javascript/javascript.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        .CodeMirror {border: 1px solid #eee; height: 200px;}
    </style>
</head>
<body>

<h2>CodeMirror Collaborative Editor (Test)</h2>

<div>
    <textarea id="editor1"></textarea>
</div>

<script>
    let stompClient;
    let userId = "user-624"; // Set unique for each user
    let lockedBy = null;

    let editor = CodeMirror.fromTextArea(document.getElementById('editor1'), {
        mode: 'javascript',
        lineNumbers: true,
        theme: 'default',
        readOnly: false
    });

    function connect() {
        let socket = new SockJS('http://localhost:1235/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            stompClient.subscribe('/topic/editor', function (message) {
                let edit = JSON.parse(message.body);
                if (edit.type === "lock") {
                    lockedBy = edit.userId;
                    editor.setOption("readOnly", lockedBy !== userId);
                } else if (edit.type === "edit") {
                    applyCodeEdit(edit);
                }
            });
        });
    }

    function sendLock() {
        if (!stompClient || !stompClient.connected) return;
        stompClient.send("/app/edit", {}, JSON.stringify({ type: "lock", userId: userId }));
    }

    function sendCodeEdit(changeObj) {
        if (!stompClient || !stompClient.connected) return;
        let editMessage = {
            type: "edit",
            sessionId: "default",
            userId: userId,
            lineNumber: changeObj.from.line,
            startIndex: changeObj.from.ch,
            endIndex: changeObj.to.ch,
            newText: changeObj.text.join("\n")
        };
        stompClient.send("/app/edit", {}, JSON.stringify(editMessage));
    }

    let timeout;
    editor.on("beforeChange", function(instance, changeObj) {
        if (lockedBy && lockedBy !== userId) {
            changeObj.cancel(); // Prevent editing if not locked by this user
        }
    });
    editor.on("change", function(instance, changeObj) {
        clearTimeout(timeout);
        timeout = setTimeout(() => sendCodeEdit(changeObj), 300);
    });

    // Acquire lock on focus
    editor.on("focus", function() {
        if (lockedBy !== userId) sendLock();
    });

    function applyCodeEdit(edit) {
        if (edit.userId === userId) return;
        editor.replaceRange(
            edit.newText,
            { line: edit.lineNumber, ch: edit.startIndex },
            { line: edit.lineNumber, ch: edit.endIndex }
        );
    }

    connect();
    
</script>
</body>
</html>
