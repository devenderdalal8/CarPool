<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>CodeMirror WebSocket Collaboration Test</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.7/mode/javascript/javascript.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        .CodeMirror {border: 1px solid #eee; height: 200px;}
    </style>
</head>
<body>

<h2>CodeMirror Collaborative Editor (Test)</h2>

<div>
    <textarea id="editor1"></textarea>
</div>

<script>
    let stompClient;
    let userId = "user-" + Math.floor(Math.random() * 1000);
    let editor = CodeMirror.fromTextArea(document.getElementById('editor1'), {
        mode: 'javascript',
        lineNumbers: true,
        theme: 'default'
    });

    // Connect to WebSocket backend
    function connect() {
        let socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);

            // Subscribe to updates broadcast by server
            stompClient.subscribe('/topic/editor', function (message) {
                let edit = JSON.parse(message.body);
                console.log('edit: ' + edit + 'user userId: ' + userId + 'user sessionId: ' + edit.userId);
                if(edit.userId != userId){
                    applyCodeEdit(edit);
                }
            });
        });
    }

    function applyCodeEdit(edit) {
        // Only update the changed part, not the whole code
        if (
            typeof edit.lineNumber === "number" &&
            typeof edit.startIndex === "number" &&
            typeof edit.endIndex === "number" &&
            typeof edit.newText === "string"
        ) {
            let doc = editor.getDoc();
            let line = edit.lineNumber;
            let from = { line: line, ch: edit.startIndex };
            let to = { line: line, ch: edit.endIndex };
            doc.replaceRange(edit.newText, from, to);
        }
        console.log('Received patch:', edit);
    }


    // Send local changes to server as CodeEdit messages
    function sendCodeEdit() {
       editor.on("change", function (instance, changeObj) {
    if (!stompClient || !stompClient.connected) return;

    let editMessage = {
        sessionId: "default",
        userId: userId,
        fullCode: editor.getValue(),
        lineNumber: changeObj.from.line,
        startIndex: changeObj.from.ch,
        endIndex: changeObj.to.ch,
        newText: changeObj.text.join("\n")
    };
    stompClient.send("/app/edit", {}, JSON.stringify(editMessage));
});

    }

    // Listen for editor changes and debounce sending messages
    let timeout;
    editor.on("change", function () {
        clearTimeout(timeout);
        timeout = setTimeout(sendCodeEdit, 300);
    });

    connect();
</script>

</body>
</html>
